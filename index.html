<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Black Force 007 — Quiz Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🕵️‍♂️ Black Force 007 — Quiz Game</h1>
    <button id="startBtn">স্টার্ট করুন</button>
    <div id="quizBox" class="hidden">
      <div id="questionCounter"></div>
      <div id="questionText"></div>
      <ul id="optionsList"></ul>
      <div id="timer">⏱️ ৩০</div>
      <div id="feedback"></div>
    </div>
    <div id="resultBox" class="hidden">
      <h2>আপনার স্কোর:</h2>
      <p id="scoreText"></p>
      <button id="restartBtn">আবার শুরু করুন</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
